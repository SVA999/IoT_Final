# Ejemplo de como desplegar en un ambiente de prueba un framework FIWARE para 
# una aplicacion de ciudad inteligente / Internet de las Cosas
#
# En este ejemplo vamos a usar un sensor que lee la temperatura de una termocupla
# y la almacena en una base de datos en un servidor FiWARE en la Nube
# sudo sysctl -w vm.max_map_count=262144
version: "3.8"
services:
  frontend:
    build: ./app
    container_name: frontend
    hostname: pagina
    ports:
      - "80:80"
    command: python3 app.py
  # Orion es el motor principal, el agente, el context broker
  orion:
    image: fiware/orion-ld
    hostname: orion
    container_name: orion
    depends_on:
      - mongo-db
    networks:
      - default
    expose:
      - "1026"
    ports:
      - "1026:1026" # localhost:1026
    command: -dbhost mongo-db -logLevel DEBUG
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail -s http://localhost:1026/version || exit 1" ]
      interval: 10m0s
      timeout: 30s
      retries: 5
      start_period: 30s

  #Quantum Leap
  quantumleap:
    image: orchestracities/quantumleap
    hostname: quantumleap
    container_name: fiware-quantumleap
    ports:
      - "8668:8668"
    depends_on:
      - crate-db
      #- redis-db
    environment:
      - CRATE_HOST=crate-db
      - LOGLEVEL=DEBUG

  # Bases de datos
  mongo-db:
    image: mongo:4.4
    hostname: mongo-db
    container_name: db-mongo
    expose:
      - "27017"
    ports:
      - "27017:27017"
    networks:
      - default
    volumes:
      - mongo-db:/data/db

  crate-db:
    image: crate
    hostname: crate-db
    container_name: db-crate
    ports:
      - "4200:4200"
      - "4300:4300"
      - "5432:5432"
    command: crate -Cauth.host_based.enabled=false  -Ccluster.name=democluster -Chttp.cors.enabled=true -Chttp.cors.allow-origin="*"
    environment:
      - CRATE_HEAP_SIZE=4g
    volumes:
      - crate-db:/data

  # Data Warehouse
  postgres-dwh:
    image: postgres:15
    container_name: dwh-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin0102
      POSTGRES_DB: plantas_dwh
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./dwh/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default

  # visualizacion
  grafana:
    image: grafana/grafana
    container_name: grafana
    depends_on:
      - crate-db
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana

  # ETL Job
  etl-job:
    build: ./etl
    container_name: etl_processor
    depends_on:
      - crate-db
      - postgres-dwh
    networks:
      - default

  # API Backend
  api-backend:
    build: ./api_ai
    container_name: api_ai_backend
    depends_on:
      - postgres-dwh
    ports:
      - "8000:8000" # Opcional, para el Frontend
    networks:
      - default

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.1.0/24

volumes:
  mongo-db: ~
  crate-db: ~
  grafana: ~
