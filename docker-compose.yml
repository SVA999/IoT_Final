# Plataforma de monitoreo de plantas (Agricultura) - arquitectura de la pizarra:
# Sensor -> Agente IoT -> Orion(+Mongo) -> QuantumLeap -> CrateDB -> ETL (limpiar/analizar)
#        -> Postgres (DWH) -> API (+IA) -> Front        (+ Grafana opcional)
# Requisito en el host:  sudo sysctl -w vm.max_map_count=262144
services:
  # ---------- Ingesta ----------
  iot-agent:
    image: fiware/iotagent-json:3.4.0   # version fija: 'latest' entraba en bucle de reinicio
    container_name: iot-agent
    restart: unless-stopped
    depends_on: [orion, mongo-db]
    ports:
      - "4041:4041"
      - "7896:7896"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_CB_NGSI_VERSION=v2
      - IOTA_AUTOCAST=true
      - IOTA_LOG_LEVEL=DEBUG
      - IOTA_MONGO_HOST=mongo-db
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagentjson
      - IOTA_HTTP_PORT=7896
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      

  # ---------- Contexto ----------
  orion:
    image: fiware/orion            # NGSI v2 (QuantumLeap lo requiere); orion-ld solo si migran a NGSI-LD
    container_name: orion
    restart: unless-stopped
    depends_on: [mongo-db]
    ports:
      - "1036:1026"   # puerto 1036 abierto en el Security Group -> 1026 interno
    command: -dbURI mongodb://mongo-db -logLevel INFO

  mongo-db:
    image: mongo:4.4
    container_name: db-mongo
    restart: unless-stopped
    expose: ["27017"]               # solo red interna
    volumes: [mongo-db:/data/db]

  # ---------- Historico crudo ----------
  quantumleap:
    image: orchestracities/quantumleap
    container_name: fiware-quantumleap
    restart: unless-stopped
    depends_on: [crate-db]
    expose: ["8668"]
    environment:
      - CRATE_HOST=crate-db
      - CRATE_DB_USER=iot
      - CRATE_DB_PASS=${CRATE_PASSWORD:?define CRATE_PASSWORD en .env}
      - LOGLEVEL=INFO

  crate-db:
    image: crate:5.8
    container_name: db-crate
    restart: unless-stopped
    ports:
      - "4200:4200"                 # Admin UI / HTTP
    expose: ["4300", "5432"]        # 5432 de Crate NO se publica (choca con el DWH)
    # Auth: el superusuario integrado 'crate' no admite clave; solo entra sin ella desde dentro del contenedor (_local_,
    # lo usa doc/crate_auth.sh para crear el usuario 'iot'). El resto (UI, QuantumLeap, ETL, Grafana) usa iot + CRATE_PASSWORD.
    command: >
      crate -Cauth.host_based.enabled=true
      -Cauth.host_based.config.0.user=crate -Cauth.host_based.config.0.address=_local_ -Cauth.host_based.config.0.method=trust
      -Cauth.host_based.config.99.method=password
      -Ccluster.name=plantcluster -Chttp.cors.enabled=true -Chttp.cors.allow-origin="*"
    environment:
      - CRATE_HEAP_SIZE=2g          # t3.large = 8 GB RAM compartidos
    volumes: [crate-db:/data]

  # ---------- Procesamiento y DWH ----------
  dwh:
    image: postgres:16
    container_name: dwh-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"       # solo loopback del host: DataGrip entra por tunel SSH
    environment:
      - POSTGRES_USER=${DWH_USER:-dwh}
      - POSTGRES_PASSWORD=${DWH_PASSWORD:?define DWH_PASSWORD en .env}
      - POSTGRES_DB=${DWH_DB:-plantas}
    volumes:
      - dwh-data:/var/lib/postgresql/data
      - ./app/dwh/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  etl:
    build: ./app/etl
    container_name: etl
    restart: unless-stopped
    depends_on: [crate-db, dwh, orion]
    environment:
      - CRATE_URL=http://crate-db:4200/_sql
      - CRATE_USER=iot
      - CRATE_PASSWORD=${CRATE_PASSWORD:?define CRATE_PASSWORD en .env}
      - DWH_DSN=postgresql://${DWH_USER:-dwh}:${DWH_PASSWORD}@dwh:5432/${DWH_DB:-plantas}
      - ORION_URL=http://orion:1026
      - ETL_INTERVAL_SECONDS=300
      - CRATE_TABLE=mtopeniot.etplantsensor

  # ---------- Logica de negocio + IA ----------
  api:
    build: ./app/api_ai
    container_name: api
    restart: unless-stopped
    depends_on: [dwh]
    expose: ["8000"]                # solo el front (nginx) la consume
    environment:
      - DWH_DSN=postgresql://${DWH_USER:-dwh}:${DWH_PASSWORD}@dwh:5432/${DWH_DB:-plantas}
      - FRONT_USER=${FRONT_USER:-admin}
      - FRONT_PASSWORD=${FRONT_PASSWORD:?define FRONT_PASSWORD en .env}
      - AUTH_SECRET=${AUTH_SECRET:?define AUTH_SECRET en .env}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}

  # ---------- Presentacion ----------
  frontend:
    build: ./app/frontend
    container_name: frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"

  grafana:                           # opcional (admin/tecnico)
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    depends_on: [crate-db, dwh]
    ports:
      - "3000:3000"
    volumes: [grafana:/var/lib/grafana]

volumes:
  mongo-db:
  crate-db:
  dwh-data:
  grafana:
