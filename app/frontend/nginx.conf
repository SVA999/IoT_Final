server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos compilados: su nombre lleva un hash y cambia en cada version, asi que se pueden cachear para siempre.
  # Si uno no existe se responde 404 (NO el index.html: el navegador lo tomaba por JavaScript y dejaba la pagina en blanco).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # El HTML NO se guarda en cache: tras un despliegue el navegador siempre recibe el index.html nuevo,
  # que apunta a los archivos nuevos. Sin esto, quien tenia la pagina abierta veia una pantalla en blanco.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # WebSocket de notificaciones (predicciones). Mas especifico que /api/, asi que gana.
  location /api/ws {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;        # el cliente envia un ping cada 25 s
  }

  location /api/ {
    proxy_pass http://api:8000;      # front y API comparten origen (sin CORS)
    proxy_read_timeout 75s;          # el chat con Gemini puede tardar
  }
}
