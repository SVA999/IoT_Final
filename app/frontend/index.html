<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitoreo de plantas</title>
<style>
  body { font-family: system-ui; margin: 1rem auto; max-width: 900px; padding: 0 1rem }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: .8rem; margin: .5rem 0 }
  .warning { color: #b26a00 } .error { color: #b00020 }
</style>
<h1>Plantas</h1><div id="plantas"></div>
<h2>Alertas</h2><div id="alertas"></div>
<h2>Pregunta a la IA</h2>
<input id="q" style="width:70%" placeholder="¿Debo regar hoy?"> <button onclick="ask()">Enviar</button>
<pre id="r"></pre>
<script>
const j = (u, o) => fetch(u, o).then(r => r.json());
async function load() {
  plantas.innerHTML = (await j('/api/plantas')).map(p =>
    `<div class="card"><b>${p.entity_id}</b> — ${p.temperature ?? '?'} °C · ${p.humidity ?? '?'} % HR · ${p.luminosity ?? "?"} lux · suelo ${p.soil_moisture ?? "?"} %<br><small>${p.ts}</small></div>`).join('');
  alertas.innerHTML = (await j('/api/alertas')).map(a =>
    `<div class="${a.severidad}">[${a.severidad}] ${a.entity_id}: ${a.mensaje} <small>${a.ts}</small></div>`).join('') || 'Sin alertas';
}
async function ask() {
  r.textContent = '...';
  r.textContent = (await j('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({pregunta: q.value})})).respuesta;
}
load(); setInterval(load, 30000);
</script>
</html>
